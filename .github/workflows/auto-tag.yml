name: Auto Tag and Publish

on:
  push:
    branches:
      - main
    paths:
      - 'packages/server/package.json'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  tag-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Check if version changed
        id: version
        run: |
          git fetch --tags
          CURRENT_VERSION=$(bun -p "require('./packages/server/package.json').version")
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Tag v$CURRENT_VERSION already exists, skipping"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Tag v$CURRENT_VERSION does not exist, will create"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.changed == 'true'
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        if: steps.version.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: bun run build

      - name: Test
        if: steps.version.outputs.changed == 'true'
        run: bun run test

      - name: Typecheck
        if: steps.version.outputs.changed == 'true'
        run: bun run typecheck

      - name: Upgrade npm (required for OIDC trusted publishing)
        if: steps.version.outputs.changed == 'true'
        run: npm install -g npm@latest

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION="v${{ steps.version.outputs.current }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.current }}"
          gh release create "$VERSION" --title "$VERSION" --generate-notes

      - name: Publish backlog-mcp to npm
        if: steps.version.outputs.changed == 'true'
        run: |
          cp README.md packages/server/README.md
          cd packages/server
          bun pm pack
          npm publish backlog-mcp-*.tgz --provenance --access public
